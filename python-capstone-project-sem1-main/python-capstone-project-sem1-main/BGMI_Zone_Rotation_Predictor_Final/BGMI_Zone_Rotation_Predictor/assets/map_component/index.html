<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b151c;color:#e5eee9;font:14px/1.4 "Segoe UI",Arial,sans-serif;overflow:hidden}
.wrap{padding:8px 10px 12px;background:linear-gradient(180deg,#101e27,#0b151c);border:1px solid #263d48;border-radius:16px}
.toolbar{height:34px;display:flex;justify-content:space-between;align-items:center;padding:0 3px 7px;color:#b9cbc7;font-size:12px;letter-spacing:.04em}
.toolbar strong{color:#eaf2ea;letter-spacing:.12em}.map{display:block;width:auto;height:min(320px,80vw);max-width:100%;margin-inline:auto;border-radius:11px;background:#0b202b;touch-action:none;user-select:none}
.zone-hit{fill:#53d69a;fill-opacity:.07;stroke:#57e4a8;stroke-width:3;cursor:move}.zone-core{fill:#4cd79c;fill-opacity:.07;stroke:#e4fff2;stroke-opacity:.88;stroke-width:1.5;pointer-events:none}
.zone-label{fill:#e9fff3;font-size:11px;font-weight:700;letter-spacing:1px;paint-order:stroke;stroke:#10231d;stroke-width:3px;pointer-events:none}
.handle{fill:#e7fff3;stroke:#37d996;stroke-width:3;cursor:nwse-resize}.team-dot{fill:#ff6a70;stroke:#fff1df;stroke-width:3;filter:drop-shadow(0 0 5px #ff6a70)}.team-hit{cursor:grab}.team-cross{stroke:#fff1df;stroke-width:2;pointer-events:none}
.pred-zone{fill:#59a8ff;fill-opacity:.06;stroke:#67b4ff;stroke-width:2.5;stroke-dasharray:7 6;pointer-events:none}.route-primary{fill:none;stroke:#ffd35d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px #ffcf4b)}.route-alt{fill:none;stroke:#b99aff;stroke-opacity:.75;stroke-width:2.5;stroke-dasharray:7 6;stroke-linecap:round}.destination{fill:#ffd35d;stroke:#17212a;stroke-width:2.5}.legend{display:flex;gap:12px;flex-wrap:wrap;padding:8px 4px 0;color:#a8bfbb;font-size:10px}.legend span{display:inline-flex;align-items:center;gap:5px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.line{width:17px;height:3px;display:inline-block}
</style></head><body><div class="wrap"><div class="toolbar"><strong id="mapName">ERANGEL</strong><span>Drag the zone · drag its handle to resize · click/drag map to place team · Shift+drag to pan · scroll to zoom</span></div>
<svg id="map" class="map" viewBox="0 0 1 1" preserveAspectRatio="none" aria-label="Interactive Erangel map">
<defs><marker id="arrowGold" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto"><path d="M0 0 5 2.5 0 5z" fill="#ffd35d"/></marker><marker id="arrowLilac" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto"><path d="M0 0 5 2.5 0 5z" fill="#b99aff"/></marker></defs>
<image id="base" x="0" y="0" width="1" height="1" preserveAspectRatio="none" aria-label="Official PUBG Erangel map image"/>
<g id="routes" pointer-events="none"></g><g id="predictions" pointer-events="none"></g>
<path id="zoneHit" class="zone-hit" d=""/><path id="zoneCore" class="zone-core" d=""/><text id="zoneLabel" class="zone-label">CURRENT SAFE ZONE</text><circle id="resizeHit" r="16" fill="transparent" stroke="transparent" stroke-width="12"/><circle id="resizeHandle" class="handle" r="7"/>
<g id="team" class="team-hit" visibility="hidden"><circle class="team-dot" r="8"/><path class="team-cross" d="M-4 0h8M0-4v8"/><text x="11" y="3" class="zone-label" style="font-size:9px">TEAM</text></g>
</svg><div class="legend"><span><i class="dot" style="background:#57e4a8"></i>Current zone</span><span><i class="dot" style="background:#67b4ff"></i>Predicted zone</span><span><i class="dot" style="background:#ff6a70"></i>Team</span><span><i class="line" style="background:#ffd35d"></i>Recommended</span><span><i class="line" style="background:#b99aff"></i>Alternative</span></div></div>
<script>
const svg=document.getElementById('map'),base=document.getElementById('base'),hit=document.getElementById('zoneHit'),core=document.getElementById('zoneCore'),handle=document.getElementById('resizeHandle'),resizeHit=document.getElementById('resizeHit'),teamNode=document.getElementById('team'),predictionLayer=document.getElementById('predictions'),routeLayer=document.getElementById('routes');
let args={},cfg={image_width:474,image_height:429,reference_width:1042.3654015887,reference_height:1000,source_to_image:[.47472602562,0,.72323129,0,.46064945234,-6.69447652]},state={team:null,zone:{x:521.1827007944,y:500,r:240,placed:false},view_box:[0,0,474,429]},drag=null,panStart=null,wheelTimer=null,interactionId=0;
function send(type,payload){parent.postMessage({isStreamlitMessage:true,type,...payload},'*')}
function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
function displayPoint(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());return {x:q.x,y:q.y}}
function point(e,clampToMap=false){const p=displayPoint(e);if(!clampToMap&&(p.x<0||p.x>cfg.image_width||p.y<0||p.y>cfg.image_height))return null;const q=imagePoint(clamp(p.x,0,cfg.image_width),clamp(p.y,0,cfg.image_height));if(clampToMap)return {x:clamp(q.x,0,cfg.reference_width),y:clamp(q.y,0,cfg.reference_height)};if(q.x<0||q.x>cfg.reference_width||q.y<0||q.y>cfg.reference_height)return null;return q}
function modelPoint(x,y){const m=cfg.source_to_image;return {x:m[0]*x+m[1]*y+m[2],y:m[3]*x+m[4]*y+m[5]}}
function imagePoint(x,y){const m=cfg.source_to_image;return {x:(x-m[2])/m[0],y:(y-m[5])/m[4]}}
function circlePath(x,y,r){const n=96,out=[];for(let i=0;i<=n;i++){const a=2*Math.PI*i/n,p=modelPoint(x+r*Math.cos(a),y+r*Math.sin(a));out.push((i?'L':'M')+p.x.toFixed(3)+' '+p.y.toFixed(3))}return out.join(' ')+' Z'}
function paint(){const z=state.zone||{x:cfg.reference_width/2,y:cfg.reference_height/2,r:240,placed:false},c=modelPoint(z.x,z.y),edge=modelPoint(z.x+z.r,z.y);[hit,core].forEach(n=>n.setAttribute('d',circlePath(z.x,z.y,z.r)));hit.setAttribute('stroke-dasharray',z.placed?'none':'6 5');core.setAttribute('visibility',z.placed?'visible':'hidden');document.getElementById('zoneLabel').setAttribute('x',c.x+5);document.getElementById('zoneLabel').setAttribute('y',Math.max(12,c.y-z.r*cfg.source_to_image[4]-5));[handle,resizeHit].forEach(n=>{n.setAttribute('cx',clamp(edge.x,0,cfg.image_width));n.setAttribute('cy',clamp(edge.y,0,cfg.image_height));n.setAttribute('visibility',z.placed?'visible':'hidden')});
if(state.team){const t=modelPoint(state.team.x,state.team.y);teamNode.setAttribute('transform',`translate(${t.x} ${t.y})`);teamNode.setAttribute('visibility','visible')}else teamNode.setAttribute('visibility','hidden');
predictionLayer.replaceChildren();const predictions=Array.isArray(args.predicted)?args.predicted:(args.predicted?[args.predicted]:[]);predictions.forEach((zone,i)=>{const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',circlePath(zone.center_x,zone.center_y,zone.radius));path.setAttribute('class','pred-zone');path.setAttribute('stroke-opacity',i===0?'.95':String(Math.max(.35,.8-i*.18)));path.setAttribute('fill-opacity',i===0?'.08':'.035');predictionLayer.appendChild(path)});
routeLayer.replaceChildren();const routes=args.routes||[];routes.slice(1).reverse().forEach(r=>routeLayer.appendChild(route(r,false)));if(routes.length)routeLayer.appendChild(route(routes[0],true))}
function route(r,primary){if(!r||!r.waypoints?.length)return document.createElementNS('http://www.w3.org/2000/svg','g');const p=document.createElementNS('http://www.w3.org/2000/svg','polyline');p.setAttribute('points',r.waypoints.map(v=>{const q=modelPoint(v[0],v[1]);return `${q.x},${q.y}`}).join(' '));p.setAttribute('class',primary?'route-primary':'route-alt');p.setAttribute('marker-end',`url(#${primary?'arrowGold':'arrowLilac'})`);const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.appendChild(p);const d=document.createElementNS('http://www.w3.org/2000/svg','path'),dest=modelPoint(r.destination[0],r.destination[1]);d.setAttribute('d',`M${dest.x} ${dest.y-7}l7 7-7 7-7-7z`);d.setAttribute('class','destination');g.appendChild(d);return g}
function commit(){interactionId+=1;send('streamlit:setComponentValue',{value:{team:state.team,zone:state.zone,view_box:state.view_box,interaction_id:interactionId},dataType:'json'})}
function render(next){args=next;cfg=args.map_config||cfg;document.getElementById('mapName').textContent=(args.map_name||'ERANGEL').toUpperCase();svg.style.aspectRatio=`${cfg.image_width}/${cfg.image_height}`;svg.style.setProperty('--map-ratio',cfg.image_width/cfg.image_height);base.setAttribute('href',args.map_image);base.setAttribute('width',cfg.image_width);base.setAttribute('height',cfg.image_height);svg.setAttribute('viewBox',(args.view_box||[0,0,cfg.image_width,cfg.image_height]).join(' '));state.team=args.team||null;state.zone=args.zone||{x:cfg.reference_width/2,y:cfg.reference_height/2,r:240,placed:false};state.view_box=args.view_box||[0,0,cfg.image_width,cfg.image_height];paint()}
svg.addEventListener('pointerdown',e=>{const p=point(e),target=e.target,kind=target.dataset.drag;if(e.shiftKey){panStart={pointer:e.pointerId,clientX:e.clientX,clientY:e.clientY,box:[...state.view_box]};svg.setPointerCapture(e.pointerId);e.preventDefault();return}if(kind==='resize'){drag={kind,pointer:e.pointerId};svg.setPointerCapture(e.pointerId);e.preventDefault();return}if(kind==='zone'&&p){drag={kind:'zone-pending',pointer:e.pointerId,startX:e.clientX,startY:e.clientY,dx:p.x-state.zone.x,dy:p.y-state.zone.y,last:p};svg.setPointerCapture(e.pointerId);e.preventDefault();return}if(kind==='team'||target.closest('#team')){drag={kind:'team',pointer:e.pointerId};svg.setPointerCapture(e.pointerId);e.preventDefault();return}drag={kind:'place',pointer:e.pointerId,point:p};svg.setPointerCapture(e.pointerId);e.preventDefault()});
hit.dataset.drag='zone';handle.dataset.drag='resize';resizeHit.dataset.drag='resize';teamNode.dataset.drag='team';
svg.addEventListener('pointermove',e=>{if(drag&&drag.pointer===e.pointerId){const p=point(e,true),d=displayPoint(e);if(drag.kind==='zone-pending'){drag.last=p;if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>5)drag.kind='zone'}if(drag.kind==='zone'){state.zone={...state.zone,x:clamp(p.x-drag.dx,0,cfg.reference_width),y:clamp(p.y-drag.dy,0,cfg.reference_height),placed:true};paint()}else if(drag.kind==='resize'){const c=modelPoint(state.zone.x,state.zone.y);state.zone={...state.zone,r:clamp(Math.hypot(p.x-state.zone.x,p.y-state.zone.y),30,Math.min(cfg.reference_width,cfg.reference_height)),placed:true};paint()}else if(drag.kind==='team'){state.team=p;paint()}else if(drag.kind==='place'){drag.point=point(e)}}else if(panStart&&panStart.pointer===e.pointerId){const b=panStart.box,rect=svg.getBoundingClientRect(),dx=(e.clientX-panStart.clientX)/rect.width*b[2],dy=(e.clientY-panStart.clientY)/rect.height*b[3];state.view_box=[clamp(b[0]-dx,-cfg.image_width,cfg.image_width),clamp(b[1]-dy,-cfg.image_height,cfg.image_height),b[2],b[3]];svg.setAttribute('viewBox',state.view_box.join(' '))}});
svg.addEventListener('pointerup',e=>{if(drag&&drag.pointer===e.pointerId){if(drag.kind==='place'&&drag.point)state.team=drag.point;else if(drag.kind==='zone-pending'&&drag.last)state.team=drag.last;drag=null;paint();commit()}if(panStart&&panStart.pointer===e.pointerId){panStart=null;commit()}});
svg.addEventListener('wheel',e=>{e.preventDefault();const p=displayPoint(e),b=state.view_box,f=e.deltaY<0?.84:1.19,minWidth=cfg.image_width/4,maxWidth=cfg.image_width,w=clamp(b[2]*f,minWidth,maxWidth),h=w*cfg.image_height/cfg.image_width,rx=(p.x-b[0])/b[2],ry=(p.y-b[1])/b[3];state.view_box=[p.x-rx*w,p.y-ry*h,w,h];svg.setAttribute('viewBox',state.view_box.join(' '));clearTimeout(wheelTimer);wheelTimer=setTimeout(commit,150)},{passive:false});
window.addEventListener('message',e=>{if(e.data?.type==='streamlit:render')render(e.data.args)});send('streamlit:componentReady',{apiVersion:1});
const wrap=document.querySelector('.wrap'),resizeObserver=new ResizeObserver(()=>send('streamlit:setFrameHeight',{height:Math.ceil(wrap.getBoundingClientRect().height+8)}));resizeObserver.observe(wrap);setTimeout(()=>send('streamlit:setFrameHeight',{height:Math.ceil(wrap.getBoundingClientRect().height+8)}),0);
</script></body></html>
